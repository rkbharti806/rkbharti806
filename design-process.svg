<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2B75C"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9812E"/>
      <stop offset="100%" stop-color="#A66A22"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9902F"/>
      <stop offset="100%" stop-color="#B67525"/>
    </linearGradient>
    <linearGradient id="topFaceLaunch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F27A6C"/>
      <stop offset="100%" stop-color="#E85A4F"/>
    </linearGradient>
    <linearGradient id="leftFaceLaunch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4453B"/>
      <stop offset="100%" stop-color="#9E362E"/>
    </linearGradient>
    <linearGradient id="rightFaceLaunch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6524A"/>
      <stop offset="100%" stop-color="#AE3F37"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="#12121F"/>

  <!-- isometric ground grid -->
  <g stroke="#232338" stroke-width="1">
    <path d="M0,220 L900,220" opacity="0.5"/>
    <path d="M50,260 L850,260" opacity="0.3"/>
  </g>

  <!-- connecting path (isometric, dashed) -->
  <path d="M90,150 L270,110 L450,150 L630,110 L810,150" fill="none" stroke="#2D6E7E" stroke-width="3" stroke-dasharray="8,8">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- ===== isometric block template used 5x: top rhombus + two side faces ===== -->

  <!-- Block 1: Idea (x=90, top y=150) -->
  <g>
    <g id="block1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.2s" repeatCount="indefinite"/>
      <polygon points="90,120 130,140 90,160 50,140" fill="url(#topFace)"/>
      <polygon points="50,140 90,160 90,190 50,170" fill="url(#leftFace)"/>
      <polygon points="130,140 90,160 90,190 130,170" fill="url(#rightFace)"/>
      <text x="90" y="150" text-anchor="middle" font-family="Verdana" font-size="18" fill="#1A1A2E">💡</text>
    </g>
    <text x="90" y="215" text-anchor="middle" font-family="Verdana" font-size="12" fill="#F7F3EC">Idea</text>
  </g>

  <!-- Block 2: Design (x=270, top y=110, raised) -->
  <g>
    <g id="block2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      <polygon points="270,80 310,100 270,120 230,100" fill="url(#topFace)"/>
      <polygon points="230,100 270,120 270,150 230,130" fill="url(#leftFace)"/>
      <polygon points="310,100 270,120 270,150 310,130" fill="url(#rightFace)"/>
      <text x="270" y="110" text-anchor="middle" font-family="Verdana" font-size="18" fill="#1A1A2E">🎨</text>
    </g>
    <text x="270" y="175" text-anchor="middle" font-family="Verdana" font-size="12" fill="#F7F3EC">Design</text>
  </g>

  <!-- Block 3: Build (x=450, top y=150) -->
  <g>
    <g id="block3">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
      <polygon points="450,120 490,140 450,160 410,140" fill="url(#topFace)"/>
      <polygon points="410,140 450,160 450,190 410,170" fill="url(#leftFace)"/>
      <polygon points="490,140 450,160 450,190 490,170" fill="url(#rightFace)"/>
      <text x="450" y="150" text-anchor="middle" font-family="Verdana" font-size="18" fill="#1A1A2E">💻</text>
    </g>
    <text x="450" y="215" text-anchor="middle" font-family="Verdana" font-size="12" fill="#F7F3EC">Build</text>
  </g>

  <!-- Block 4: Promote (x=630, top y=110, raised) -->
  <g>
    <g id="block4">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
      <polygon points="630,80 670,100 630,120 590,100" fill="url(#topFace)"/>
      <polygon points="590,100 630,120 630,150 590,130" fill="url(#leftFace)"/>
      <polygon points="670,100 630,120 630,150 670,130" fill="url(#rightFace)"/>
      <text x="630" y="110" text-anchor="middle" font-family="Verdana" font-size="18" fill="#1A1A2E">📣</text>
    </g>
    <text x="630" y="175" text-anchor="middle" font-family="Verdana" font-size="12" fill="#F7F3EC">Promote</text>
  </g>

  <!-- Block 5: Launch (x=810, top y=150, accent color, biggest glow) -->
  <g filter="url(#softGlow)">
    <g id="block5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="1.6s" repeatCount="indefinite"/>
      <polygon points="810,118 852,140 810,162 768,140" fill="url(#topFaceLaunch)"/>
      <polygon points="768,140 810,162 810,192 768,172" fill="url(#leftFaceLaunch)"/>
      <polygon points="852,140 810,162 810,192 852,172" fill="url(#rightFaceLaunch)"/>
      <text x="810" y="150" text-anchor="middle" font-family="Verdana" font-size="18" fill="#FFF7EE">🚀</text>
    </g>
    <text x="810" y="218" text-anchor="middle" font-family="Verdana" font-size="12" fill="#F7F3EC">Launch</text>
  </g>

  <!-- traveling spark along the isometric path -->
  <circle r="5" fill="#F2B75C" filter="url(#softGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M90,150 L270,110 L450,150 L630,110 L810,150"/>
    <animate attributeName="fill" values="#E8A33D;#E85A4F;#2D6E7E;#E8A33D" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="255" text-anchor="middle" font-family="Verdana" font-size="12" fill="#5c5c72">Idea → Design → Build → Promote → Launch</text>
</svg>
