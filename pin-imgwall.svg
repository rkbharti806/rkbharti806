<svg width="260" height="200" viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="top2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F2B75C"/><stop offset="100%" stop-color="#E8A33D"/></linearGradient>
    <linearGradient id="left2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9812E"/><stop offset="100%" stop-color="#A66A22"/></linearGradient>
    <linearGradient id="right2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D9902F"/><stop offset="100%" stop-color="#B67525"/></linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="260" height="200" fill="#12121F" rx="14"/>
  <g filter="url(#glow2)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
      <polygon points="130,55 175,80 130,105 85,80" fill="url(#top2)"/>
      <polygon points="85,80 130,105 130,140 85,115" fill="url(#left2)"/>
      <polygon points="175,80 130,105 130,140 175,115" fill="url(#right2)"/>
      <text x="130" y="90" text-anchor="middle" font-family="Verdana" font-size="22" fill="#1A1A2E">🖼️</text>
    </g>
  </g>
  <ellipse cx="130" cy="152" rx="38" ry="8" fill="#E8A33D" opacity="0.15">
    <animate attributeName="rx" values="30;42;30" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.08;0.22" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="130" y="172" text-anchor="middle" font-family="Verdana" font-weight="bold" font-size="15" fill="#F7F3EC">imgwall</text>
