<svg width="600" height="130" viewBox="0 0 600 130" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A33D">
        <animate attributeName="offset" values="-1;1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#E85A4F">
        <animate attributeName="offset" values="-0.5;1.5" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2D6E7E">
        <animate attributeName="offset" values="0;2" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .letter {
        font-family: 'Trebuchet MS', Verdana, sans-serif;
        font-weight: 700;
        cursor: default;
      }
      .letter:hover {
        animation: bounce 0.5s ease;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
    </style>
  </defs>

  <rect width="600" height="130" fill="#12121F"/>

  <!-- underline that draws itself once, then stays, redrawing on a loop -->
  <line x1="30" y1="100" x2="570" y2="100" stroke="url(#nameGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540">
    <animate attributeName="stroke-dashoffset" values="540;0;0;540" keyTimes="0;0.3;0.85;1" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- each letter is its own <text>, individually hoverable, with staggered entrance -->
  <g filter="url(#textGlow)" font-size="56" fill="url(#nameGrad)">
    <text class="letter" x="30"  y="72">R
      <animate attributeName="opacity" values="0;1" begin="0s"   dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="70"  y="72">.
      <animate attributeName="opacity" values="0;1" begin="0.05s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="90"  y="72">K
      <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="140" y="72">.
      <animate attributeName="opacity" values="0;1" begin="0.15s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="165" y="72">B
      <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="210" y="72">h
      <animate attributeName="opacity" values="0;1" begin="0.25s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="248" y="72">a
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="285" y="72">r
      <animate attributeName="opacity" values="0;1" begin="0.35s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="312" y="72">t
      <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.4s" fill="freeze"/>
    </text>
    <text class="letter" x="335" y="72">i
      <animate attributeName="opacity" values="0;1" begin="0.45s" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <text x="300" y="118" text-anchor="middle" font-family="Verdana" font-size="13" fill="#8a8aa3">hover a letter — it jumps</text>
</svg>
